[project]
name = "software-version-agent"
version = "0.1.0"
description = "Checks the latest released versions of required software and writes a report"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "packaging>=24.0",
]

[project.scripts]
software-agent = "software_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/software_agent"]
